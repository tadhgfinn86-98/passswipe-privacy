<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d7 leads finder</title>
<style>
  :root {
    --bg: #f6f6fa; --panel: #fff; --ink: #14121f; --muted: #6b6880;
    --line: #e3e2ec; --accent: #6E3CFF; --accent-ink: #fff; --warm: #d9480f; --good: #0f7b4f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12111a; --panel:#1b1a26; --ink:#eceaf5; --muted:#a6a2bd; --line:#2c2a3b; --accent:#8b6bff; --warm:#ff9f6e; --good:#4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:19px; margin:0; letter-spacing:-0.01em; }
  header span { color:var(--muted); font-size:13px; }
  main { padding:20px 24px 60px; max-width:1400px; margin:0 auto; }
  form { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; gap:12px;
         grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); align-items:end; }
  label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:5px; }
  input, select { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-size:14px; }
  .checks { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:14px; font-size:13px; color:var(--muted); }
  .checks label { display:flex; align-items:center; gap:6px; text-transform:none; letter-spacing:0; font-size:13px; margin:0; }
  .checks input { width:auto; }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:var(--accent-ink); font-weight:600; cursor:pointer; font-size:14px; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button:disabled { opacity:.55; cursor:not-allowed; }
  #status { margin:16px 0 8px; font-size:13px; color:var(--muted); min-height:20px; white-space:pre-wrap; font-variant-numeric:tabular-nums; }
  .bar { height:4px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:12px; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  .stats { display:flex; gap:18px; flex-wrap:wrap; margin:10px 0 16px; font-size:13px; color:var(--muted); }
  .stats b { color:var(--ink); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:13.5px; }
  th, td { text-align:left; padding:9px 11px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:color-mix(in srgb, var(--panel) 80%, var(--line)); font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); cursor:pointer; white-space:nowrap; }
  tbody tr:hover { background:color-mix(in srgb, var(--panel) 88%, var(--accent)); }
  a { color:var(--accent); }
  .score { font-weight:700; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; padding:1px 7px; border-radius:99px; border:1px solid var(--line); font-size:11px; color:var(--warm); margin:1px 3px 1px 0; white-space:nowrap; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  @media (max-width:760px) { main,header { padding-inline:14px; } td .hide-sm { display:none; } }
</style>
</head>
<body>
<header>
  <h1>d7 leads finder</h1>
  <span>keyword + location → contactable, scored local business leads</span>
</header>
<main>
  <form id="form">
    <div><label for="keyword">Keyword(s)</label><input id="keyword" name="keyword" placeholder="dentist, orthodontist" required></div>
    <div><label for="location">Location</label><input id="location" name="location" placeholder="Dublin, Ireland" required></div>
    <div><label for="radius">Radius (km)</label><input id="radius" name="radius" type="number" value="10" min="1" max="100"></div>
    <div><label for="limit">Max leads</label><input id="limit" name="limit" type="number" value="50" min="1" max="500"></div>
    <div><label for="source">Source</label>
      <select id="source" name="source"><option value="overpass">OpenStreetMap (free)</option><option value="google">Google Places (API key)</option></select>
    </div>
    <div><label for="sort">Sort by</label>
      <select id="sort" name="sort"><option value="score">Lead score</option><option value="name">Name</option><option value="rating">Rating</option><option value="reviews">Reviews</option></select>
    </div>
    <div><label for="minScore">Min score</label><input id="minScore" name="minScore" type="number" value="0" min="0" max="100"></div>
    <div class="checks">
      <label><input type="checkbox" name="enrich" checked> Crawl websites for emails</label>
      <label><input type="checkbox" name="requireEmail"> Email required</label>
      <label><input type="checkbox" name="requirePhone"> Phone required</label>
      <label><input type="checkbox" name="withoutWebsite"> No website only</label>
    </div>
    <div><button id="go" type="submit">Find leads</button></div>
  </form>

  <div class="bar"><i id="bar"></i></div>
  <div id="status">Enter a niche and a place to get started.</div>
  <div class="stats" id="stats" hidden></div>
  <div class="toolbar" id="toolbar" hidden>
    <button class="ghost" id="csv">Download CSV</button>
    <button class="ghost" id="json">Download JSON</button>
    <button class="ghost" id="copyEmails">Copy all emails</button>
  </div>
  <div id="results"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let leads = [];
let resultId = '';
let sortKey = 'score';
let sortDir = -1;
let stream;

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  if (stream) stream.close();
  const data = new FormData(e.target);
  const params = new URLSearchParams();
  for (const [k, v] of data.entries()) params.set(k, v === 'on' ? '1' : v);
  for (const name of ['enrich','requireEmail','requirePhone','withoutWebsite']) {
    if (!data.get(name)) params.set(name, '0');
  }

  leads = []; resultId = '';
  $('results').innerHTML = ''; $('stats').hidden = true; $('toolbar').hidden = true;
  $('go').disabled = true; $('bar').style.width = '2%';
  $('status').textContent = 'Starting…';

  stream = new EventSource('/api/search?' + params.toString());
  stream.addEventListener('progress', (ev) => {
    const p = JSON.parse(ev.data);
    const counter = p.total ? ` [${p.done ?? 0}/${p.total}]` : '';
    $('status').textContent = `${p.phase}: ${p.message}${counter}`;
    if (p.phase === 'enrich' && p.total) $('bar').style.width = `${20 + (70 * (p.done || 0)) / p.total}%`;
    else if (p.phase === 'search') $('bar').style.width = '15%';
    else if (p.phase === 'score') $('bar').style.width = '92%';
  });
  stream.addEventListener('done', (ev) => {
    const payload = JSON.parse(ev.data);
    leads = payload.leads; resultId = payload.id;
    $('bar').style.width = '100%';
    $('status').textContent = `${payload.stats.count} leads from ${payload.area?.displayName || ''}`;
    renderStats(payload.stats);
    renderTable();
    $('toolbar').hidden = leads.length === 0;
    $('go').disabled = false;
    stream.close();
  });
  stream.addEventListener('error', (ev) => {
    let message = 'connection lost';
    try { message = JSON.parse(ev.data).message; } catch {}
    $('status').textContent = 'error: ' + message;
    $('bar').style.width = '0';
    $('go').disabled = false;
    stream.close();
  });
});

function renderStats(s) {
  $('stats').hidden = false;
  $('stats').innerHTML = [
    `<span><b>${s.count}</b> leads</span>`,
    `<span><b>${s.withEmail}</b> with email</span>`,
    `<span><b>${s.withPhone}</b> with phone</span>`,
    `<span><b>${s.withoutWebsite}</b> without a website</span>`,
    `<span>avg score <b>${s.avgScore}</b></span>`,
    s.topOpportunities.length ? `<span>top angles: ${s.topOpportunities.map(o => `${esc(o.name)} (${o.count})`).join(', ')}</span>` : '',
  ].join('');
}

const COLUMNS = [
  ['score', 'Score'], ['name', 'Business'], ['phone', 'Phone'], ['email', 'Email'],
  ['domain', 'Website'], ['city', 'City'], ['rating', 'Rating'], ['opportunities', 'Angles'],
];

function renderTable() {
  if (!leads.length) { $('results').innerHTML = '<div class="empty">No leads matched. Widen the radius or relax the filters.</div>'; return; }
  const sorted = [...leads].sort((a, b) => {
    const av = a[sortKey] ?? '', bv = b[sortKey] ?? '';
    if (typeof av === 'number' || typeof bv === 'number') return ((bv || 0) - (av || 0)) * (sortDir === -1 ? 1 : -1);
    return String(av).localeCompare(String(bv)) * (sortDir === -1 ? -1 : 1);
  });
  const head = COLUMNS.map(([k, label]) => `<th data-key="${k}">${label}${sortKey === k ? (sortDir === -1 ? ' ▼' : ' ▲') : ''}</th>`).join('');
  const body = sorted.map((l) => `<tr>
    <td class="score">${l.score ?? ''}</td>
    <td>${esc(l.name)}<div class="hide-sm" style="color:var(--muted);font-size:12px">${esc(l.category || '')}</div></td>
    <td>${l.phone ? `<a href="tel:${esc(l.phone)}">${esc(l.phone)}</a>` : ''}</td>
    <td>${l.email ? `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>` : ''}</td>
    <td>${l.website ? `<a href="${esc(l.website)}" target="_blank" rel="noopener nofollow">${esc(l.domain)}</a>` : '<span style="color:var(--warm)">none</span>'}</td>
    <td>${esc(l.city || '')}</td>
    <td>${l.rating ? `${l.rating} (${l.reviews ?? 0})` : ''}</td>
    <td>${(l.opportunities || []).map((o) => `<span class="pill">${esc(o)}</span>`).join('')}</td>
  </tr>`).join('');
  $('results').innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  for (const th of document.querySelectorAll('th[data-key]')) {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (key === sortKey) sortDir *= -1; else { sortKey = key; sortDir = -1; }
      renderTable();
    });
  }
}

$('csv').addEventListener('click', () => { if (resultId) location.href = `/api/export?id=${resultId}&format=csv`; });
$('json').addEventListener('click', () => { if (resultId) location.href = `/api/export?id=${resultId}&format=json`; });
$('copyEmails').addEventListener('click', async () => {
  const emails = [...new Set(leads.flatMap((l) => l.emails || []).filter(Boolean))];
  await navigator.clipboard.writeText(emails.join(', '));
  $('copyEmails').textContent = `Copied ${emails.length}`;
  setTimeout(() => ($('copyEmails').textContent = 'Copy all emails'), 1600);
});
</script>
</body>
</html>
